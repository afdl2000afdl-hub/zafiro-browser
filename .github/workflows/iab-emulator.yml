name: IAB Emulator Smoke

# G3（stretch 门）：在 x86_64 模拟器上跑 IabSmokeTest（真实 WebView 内核）。
# 有意独立成手动触发：模拟器在 GitHub 上偏慢且偶发 flaky，不作为硬门（debug/release APK 交付不依赖它）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Chaquopy buildPython requirement

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IAB smoke test on emulator
        uses: ReactiveCircus/android-emulator-runner@2
        id: emulator
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest -e testClassPath=com.niki914.zafiro.app.iab.IabSmokeTest --no-daemon

      - name: Show test report
        if: always()
        run: |
          echo "===== instrumentation results ====="
          find app/build -path "*outputs/androidTest-results*" -name "*.xml" -exec cat {} \; 2>/dev/null || echo "(no result xml found)"
